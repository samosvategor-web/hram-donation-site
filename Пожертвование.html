<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пожертвование — Подворье</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.1/qrcode.min.js"></script>
<style>
:root{
  --paper:#e8e5de; --ink:#1b1a16; --ink-2:rgba(27,26,22,.62); --ink-3:rgba(27,26,22,.40);
  --hair:rgba(27,26,22,.22); --hair-soft:rgba(27,26,22,.12); --hair-strong:rgba(27,26,22,.5);
  --accent:#1f4f86; --panel:rgba(245,243,237,.72); --tile:#faf9f5;
  --mono:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:var(--mono);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
body{display:flex;flex-direction:column;align-items:center;padding:4px 8px 8px;}

.head{width:100%;max-width:720px;margin-bottom:20px;}
.head .a{font-size:13px;letter-spacing:.30em;font-weight:600;text-transform:uppercase;}
.head .b{font-size:9.5px;letter-spacing:.26em;color:var(--ink-3);text-transform:uppercase;margin-top:4px;}
.head .rule{width:34px;height:1px;background:var(--hair-strong);margin:11px 0 0;}

.card{width:100%;max-width:720px;border:1px solid var(--hair);background:var(--panel);
  display:grid;grid-template-columns:1fr 300px;align-items:start;}
.col{padding:26px;min-width:0;}
.col.left{border-right:1px solid var(--hair-soft);}
.col.right{display:flex;flex-direction:column;}
.sect{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px;}
.cur{font-size:.62em;color:var(--ink-2);margin-left:2px;}

/* amounts */
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.amt{appearance:none;font-family:var(--mono);cursor:pointer;border:1px solid var(--hair);background:transparent;
  color:var(--ink);padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background .18s,color .18s,border-color .18s;}
.amt .v{font-size:15px;letter-spacing:.02em;}
.amt .c{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
.amt:hover{border-color:var(--hair-strong);}
.amt.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.amt.on .c{color:rgba(232,229,222,.65);}
.custom{margin-top:10px;display:flex;align-items:center;gap:10px;border:1px solid var(--hair-soft);padding:11px 13px;}
.custom label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;}
.custom input{flex:1;min-width:0;appearance:none;border:0;background:transparent;font-family:var(--mono);
  font-size:15px;color:var(--ink);outline:none;text-align:right;}
.custom .cur2{font-size:13px;color:var(--ink-2);}

/* QR */
.qr-wrap{display:flex;flex-direction:column;align-items:center;}
.qr-tile{background:var(--tile);border:1px solid var(--hair);padding:15px;line-height:0;}
.qr-tile img{display:block;width:232px;height:232px;max-width:100%;}
.qr-sum{margin-top:15px;font-size:22px;letter-spacing:.02em;}
.qr-cap{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-top:5px;}
.save{margin-top:16px;width:100%;appearance:none;font-family:var(--mono);cursor:pointer;border:1px solid var(--ink);
  background:transparent;color:var(--ink);padding:13px 14px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:background .2s,color .2s;}
.save:hover{background:var(--ink);color:var(--paper);}
.save svg{width:13px;height:13px;}
.saved-note{font-size:9px;letter-spacing:.14em;color:var(--accent);margin-top:8px;height:11px;opacity:0;transition:opacity .3s;text-transform:uppercase;}
.saved-note.show{opacity:1;}

/* collapsible cuts */
.cuts{width:100%;margin-top:14px;border-top:1px solid var(--hair-soft);}
details.cut{border-bottom:1px solid var(--hair-soft);}
details.cut summary{list-style:none;cursor:pointer;padding:13px 1px;display:flex;align-items:center;gap:9px;
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);transition:color .2s;}
details.cut summary::-webkit-details-marker{display:none}
details.cut summary .pm{color:var(--accent);font-size:13px;line-height:1;width:10px;text-align:center;}
details.cut[open] summary .pm::before{content:"–";}
details.cut summary .pm::before{content:"+";}
details.cut summary:hover{color:var(--ink);}
details.cut .body{padding:2px 1px 16px;}

/* short instruction */
.devtog{display:inline-flex;border:1px solid var(--hair-soft);margin-bottom:10px;}
.devtog button{appearance:none;border:0;border-left:1px solid var(--hair-soft);background:transparent;font-family:var(--mono);
  cursor:pointer;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px;}
.devtog button:first-child{border-left:0}
.devtog button.on{background:var(--ink);color:var(--paper);}
.howto-line{font-size:11px;line-height:1.7;color:var(--ink-2);}
.howto-line b{color:var(--ink);font-weight:600;}

/* requisites */
.rrow{display:grid;grid-template-columns:78px 1fr;gap:10px;font-size:11px;line-height:1.5;margin-bottom:8px;}
.rrow .k{color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-size:9px;padding-top:2px;}
.rrow .v{color:var(--ink);word-break:break-word;}
.rrow.org .v{color:var(--ink-2);line-height:1.6;}
.copyrow{margin-top:10px;}
.copybtn{appearance:none;font-family:var(--mono);cursor:pointer;background:none;border:0;color:var(--accent);
  font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:0;}
.copybtn:hover{text-decoration:underline;}

@media (max-width:680px){
  .card{grid-template-columns:1fr;}
  .col.left{border-right:0;border-bottom:1px solid var(--hair-soft);}
  .col.right{order:-1;}
  .amounts{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:440px){
  .head{padding:0 2px;}
  .col{padding:18px 16px;}
  .qr-tile{padding:11px;}
  .qr-tile img{width:min(232px,70vw);height:auto;aspect-ratio:1/1;}
  .amounts{gap:7px;}
  .amt{padding:11px 3px 9px;}
  .amt .v{font-size:14px;}
  .rrow{grid-template-columns:64px 1fr;gap:8px;}
}
</style>
</head>
<body>
<div class="head">
  <div class="a">Пожертвование</div>
  <div class="b">На реализацию проекта благоустройства</div>
  <div class="rule"></div>
</div>

<div class="card">
  <div class="col left">
    <div class="sect">Сумма пожертвования</div>
    <div class="amounts" id="amounts"></div>
    <div class="custom">
      <label>Другая сумма</label>
      <input id="custom" type="text" inputmode="numeric" placeholder="—" autocomplete="off">
      <span class="cur2">₽</span>
    </div>
    <div class="cuts">
      <details class="cut" id="cutHow">
        <summary><span class="pm"></span>Как оплатить</summary>
        <div class="body">
          <div class="devtog" id="devtog"></div>
          <div class="howto-line" id="howtoLine"></div>
        </div>
      </details>
      <details class="cut" id="cutReq">
        <summary><span class="pm"></span>Реквизиты</summary>
        <div class="body" id="reqBody"></div>
      </details>
    </div>
  </div>

  <div class="col right">
    <div class="qr-wrap">
      <div class="qr-tile"><img id="qr" alt="QR-код для оплаты"></div>
      <div class="qr-sum" id="sumLabel">1 000<span class="cur">₽</span></div>
      <div class="qr-cap">Оплата по QR-коду</div>
      <button class="save" id="save">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 1 V10 M4.5 6.5 L8 10 L11.5 6.5 M2.5 13.5 H13.5"/></svg>
        Сохранить QR-код
      </button>
      <div class="saved-note" id="savedNote">Сохранено в загрузки</div>
    </div>
  </div>
</div>

<script>
(function(){
  const REQ = {
    Name: 'Религиозная организация Подворье Патриарха Московского и всея Руси при храме святой блаженной Ксении Петербургской в Даниловском г. Москвы РПЦ (МП)',
    PersonalAcc: '40703810038000014912',
    BankName: 'ПАО СБЕРБАНК',
    BIC: '044525225',
    CorrespAcc: '30101810400000000225',
    PayeeINN: '9709049820',
    KPP: '770901001',
    Purpose: 'Добровольное пожертвование на уставные цели',
  };
  const AMOUNTS = [1000, 5000, 10000, 50000, 100000, 500000];
  const fmt = (n) => n.toLocaleString('ru-RU');

  // ---- ST00012 (ГОСТ Р 56042-2014) — порядок полей в точности как в рабочем
  //      образце; Sum в копейках. node-qrcode кодирует строку в UTF-8. ----
  function buildST00012(rub){
    const sumKopecks = Math.round(rub * 100);
    return [
      'ST00012',
      'Name=' + REQ.Name,
      'PersonalAcc=' + REQ.PersonalAcc,
      'BankName=' + REQ.BankName,
      'BIC=' + REQ.BIC,
      'CorrespAcc=' + REQ.CorrespAcc,
      'PayeeINN=' + REQ.PayeeINN,
      'KPP=' + REQ.KPP,
      'Sum=' + sumKopecks,
      'Purpose=' + REQ.Purpose
    ].join('|');
  }

  const qrImg = document.getElementById('qr');
  const sumEl = document.getElementById('sumLabel');
  // те же параметры, что в рабочем образце
  const QOPTS = { errorCorrectionLevel: 'M', margin: 1, width: 440, color: { dark: '#2a1f12', light: '#ffffff' } };
  let current = 1000;

  function drawQR(rub){
    if (typeof QRCode === 'undefined') return;
    QRCode.toDataURL(buildST00012(rub), QOPTS).then((url)=>{ qrImg.src = url; }).catch(()=>{});
  }
  function setAmount(rub){
    current = rub;
    drawQR(rub);
    sumEl.innerHTML = fmt(rub) + '<span class="cur">₽</span>';
    [...document.querySelectorAll('.amt')].forEach(b => b.classList.toggle('on', +b.dataset.v === rub));
  }

  // amount chips
  const wrap = document.getElementById('amounts');
  AMOUNTS.forEach(a => {
    const b = document.createElement('button');
    b.className = 'amt'; b.dataset.v = a;
    b.innerHTML = '<span class="v">' + fmt(a) + '</span><span class="c">рублей</span>';
    b.onclick = () => { document.getElementById('custom').value = ''; setAmount(a); };
    wrap.appendChild(b);
  });

  // custom amount
  const customEl = document.getElementById('custom');
  customEl.addEventListener('input', () => {
    const digits = customEl.value.replace(/[^\d]/g, '').slice(0, 9);
    customEl.value = digits ? (+digits).toLocaleString('ru-RU') : '';
    const v = +digits;
    if (v > 0) {
      [...document.querySelectorAll('.amt')].forEach(b => b.classList.remove('on'));
      current = v; drawQR(v);
      sumEl.innerHTML = fmt(v) + '<span class="cur">₽</span>';
    }
  });

  // save QR — hi-res labelled PNG (generated fresh via the same library)
  document.getElementById('save').onclick = () => {
    QRCode.toCanvas(document.createElement('canvas'), buildST00012(current),
      { errorCorrectionLevel:'M', margin:1, width:640, color:{dark:'#2a1f12',light:'#ffffff'} })
      .then((tmp) => {
        const qd = tmp.width, m = 64;
        const out = document.createElement('canvas');
        out.width = qd + m*2; out.height = qd + m*2 + 120;
        const o = out.getContext('2d');
        o.fillStyle = '#faf9f5'; o.fillRect(0,0,out.width,out.height);
        o.drawImage(tmp, m, m);
        o.fillStyle = '#1b1a16'; o.textAlign = 'center';
        o.font = '600 ' + Math.round(qd*0.10) + 'px "IBM Plex Mono", monospace';
        o.fillText(fmt(current) + ' \u20BD', out.width/2, qd + m + 56);
        o.fillStyle = 'rgba(27,26,22,.55)';
        o.font = Math.round(qd*0.045) + 'px "IBM Plex Mono", monospace';
        o.fillText('Пожертвование · Подворье храма', out.width/2, qd + m + 92);
        const a = document.createElement('a');
        a.href = out.toDataURL('image/png');
        a.download = 'QR-пожертвование-' + current + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        const note = document.getElementById('savedNote');
        note.classList.add('show'); setTimeout(()=>note.classList.remove('show'), 2600);
      }).catch(()=>{});
  };

  // ---- short instruction (под катом, под кнопкой) ----
  const SHORT = {
    phone: 'Сохраните QR-код → приложение банка → <b>«Оплата по QR»</b> → загрузите из галереи → подтвердите.',
    desktop: 'Приложение банка на телефоне → <b>«Оплата по QR»</b> → наведите камеру на код → подтвердите.',
  };
  const devtog = document.getElementById('devtog'), howtoLine = document.getElementById('howtoLine');
  let dev = (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || matchMedia('(pointer:coarse)').matches) ? 'phone' : 'desktop';
  [['phone','Телефон'],['desktop','Компьютер']].forEach(([k,lbl])=>{
    const b=document.createElement('button'); b.textContent=lbl; b.dataset.k=k;
    b.onclick=()=>{ dev=k; renderHow(); }; devtog.appendChild(b);
  });
  function renderHow(){ [...devtog.children].forEach(b=>b.classList.toggle('on',b.dataset.k===dev)); howtoLine.innerHTML = SHORT[dev]; }
  renderHow();

  // ---- requisites (под катом) ----
  const rows = [
    ['Получатель', REQ.Name, 'org'],
    ['ИНН', REQ.PayeeINN], ['КПП', REQ.KPP],
    ['Р/с', REQ.PersonalAcc], ['Банк', REQ.BankName],
    ['К/с', REQ.CorrespAcc], ['БИК', REQ.BIC],
    ['Назначение', REQ.Purpose],
  ];
  const reqBody = document.getElementById('reqBody');
  reqBody.innerHTML = rows.map(([k,v,cls]) =>
    `<div class="rrow ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')
    + `<div class="copyrow"><button class="copybtn" id="copyReq">Скопировать реквизиты</button></div>`;
  document.getElementById('copyReq').onclick = (e) => {
    const text = rows.map(([k,v]) => k + ': ' + v).join('\n');
    navigator.clipboard && navigator.clipboard.writeText(text);
    e.target.textContent = '✓ Скопировано';
    setTimeout(()=>{ e.target.textContent = 'Скопировать реквизиты'; }, 1800);
  };

  setAmount(1000);
})();
</script>
</body>
</html>
